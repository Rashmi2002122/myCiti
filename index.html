<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="description" content="Explore Pandals, Melas, Offers & Inaugurations across India on an interactive map." />
    
    <!-- Mobile & iOS PWA tags for full-screen edge-to-edge experience -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="myCiti" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <title>myCiti</title>

    <!-- Google Identity Services (GIS) Client Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Immediate Service Worker update check -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.update();
          }
        });
      }
    </script>
  </head>
  <body class="overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
