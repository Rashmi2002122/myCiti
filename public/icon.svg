<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#151b29" />
      <stop offset="55%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>

    <!-- Ambient Ribbon Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arch 1: Saffron Amber Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffb84d" />
      <stop offset="35%" stop-color="#ff951f" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Arch 2: Festive Ruby Magenta Gradient -->
    <linearGradient id="magentaGrad" x1="10%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff4d8d" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="80%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Arch 3: Royal Mela Violet Gradient -->
    <linearGradient id="violetGrad" x1="15%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="35%" stop-color="#8a4fe0" />
      <stop offset="75%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Inner Highlights -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Midnight Slate Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- 3D Ribbon 'm' Emblem -->
  <g transform="translate(4, -12)" filter="url(#softGlow)">
    <!-- Arch 1: Saffron Amber Ribbon (Left) -->
    <path d="M 182 148 
             C 166 122, 185 106, 204 116 
             C 214 122, 222 134, 225 152 
             C 230 188, 226 238, 228 274 
             C 229 294, 240 306, 256 298 
             C 268 290, 276 270, 276 244 
             C 276 196, 252 144, 238 126
             C 216 98, 178 96, 154 122
             C 134 146, 142 188, 152 224
             C 160 258, 172 296, 196 312
             C 226 332, 268 318, 282 284
             L 282 232
             C 276 260, 254 286, 230 280
             C 210 274, 200 248, 196 220
             C 190 184, 194 164, 182 148 Z" 
          fill="url(#amberGrad)" />

    <!-- Arch 2: Festive Magenta Ribbon (Center) -->
    <path d="M 234 148 
             C 246 120, 274 112, 296 128 
             C 308 136, 316 154, 318 178 
             C 322 216, 316 264, 320 286 
             C 324 306, 342 312, 356 298 
             C 368 286, 374 260, 374 230 
             C 374 184, 354 136, 336 120 
             C 314 100, 276 102, 256 128
             C 244 144, 242 168, 240 196
             C 238 234, 244 274, 266 296
             C 288 318, 326 318, 344 290
             L 344 246
             C 336 270, 318 288, 298 282
             C 280 276, 274 252, 272 222
             C 268 184, 268 162, 234 148 Z" 
          fill="url(#magentaGrad)" />

    <!-- Arch 3: Royal Violet Ribbon (Right) -->
    <path d="M 298 148 
             C 310 120, 338 112, 360 128 
             C 372 136, 380 156, 382 180 
             C 386 218, 382 264, 388 286 
             C 394 308, 414 312, 428 296 
             C 440 282, 444 254, 442 224 
             C 440 196, 432 174, 440 156
             C 444 144, 456 142, 464 154
             C 472 166, 468 188, 464 212
             C 458 248, 448 292, 422 312
             C 392 332, 352 320, 338 286
             L 338 238
             C 346 264, 368 286, 390 280
             C 408 274, 414 252, 414 222
             C 414 184, 408 162, 298 148 Z" 
          fill="url(#violetGrad)" />
  </g>

  <!-- Typography: myCite (Plus Jakarta Sans / IBM Plex Style) -->
  <g id="wordmark" text-anchor="middle">
    <text x="256" y="420" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'IBM Plex Sans', sans-serif" 
          font-size="68" 
          font-weight="700" 
          letter-spacing="-1.5">
      <tspan fill="#f4f5f7">my</tspan><tspan fill="#ff951f">Cite</tspan>
    </text>
  </g>
</svg>
